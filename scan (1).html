<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --pri:#0f5132; --pri2:#198754; --bg:#f2f4f3; --card:#fff; --tx:#1d2420; --mut:#6b746f; --err:#b42318; --warn:#9a6700; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--tx); }
  header { background:var(--pri); color:#fff; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header b { font-size:17px; } header small { opacity:.8; }
  main { max-width:560px; margin:0 auto; padding:10px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { font-size:12px; color:var(--mut); display:block; margin:8px 0 3px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  input, select, textarea { width:100%; font-size:16px; padding:10px; border:1px solid #cfd6d2; border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--pri2); border-color:transparent; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { font-size:16px; padding:12px; border:0; border-radius:10px; font-weight:700; cursor:pointer; }
  .b-pri { background:var(--pri2); color:#fff; } .b-sec { background:#e3e8e5; color:var(--tx); }
  .b-red { background:#fde8e6; color:var(--err); } button:disabled { opacity:.5; }
  #reader { width:100%; border-radius:10px; overflow:hidden; background:#000; min-height:0; }
  #reader video { border-radius:10px; }
  .hint { font-size:13px; color:var(--mut); margin:6px 0 0; }
  #result { border:2px solid var(--pri2); }
  .kode { font-family:ui-monospace,Consolas,monospace; font-size:15px; background:#eef6f1; padding:4px 8px; border-radius:6px; display:inline-block; }
  .nama { font-size:20px; font-weight:800; margin:6px 0 2px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#e3e8e5; margin-left:4px; }
  .alert { padding:8px 10px; border-radius:8px; font-size:14px; margin-top:8px; }
  .a-warn { background:#fff4d6; color:var(--warn); } .a-err { background:#fde8e6; color:var(--err); }
  #qty { font-size:28px; font-weight:800; text-align:center; padding:12px; }
  .list .it { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #eef0ef; padding:8px 0; font-size:14px; }
  .list .it:last-child { border:0; } .list .q { font-weight:800; white-space:nowrap; }
  .list .x { background:none; color:var(--err); padding:4px 8px; font-size:13px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1d2420; color:#fff; padding:12px 18px; border-radius:10px; font-size:15px; display:none; z-index:20; max-width:90%; text-align:center; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:10px; } .chk input { width:auto; }
  .hide { display:none !important; }
  .stat { font-size:14px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <div><b>STO Barcode</b><br><small id="tgl">memuat…</small></div>
  <small id="ver"></small>
</header>
<main>
  <!-- PIC & LOKASI -->
  <div class="card">
    <div class="row">
      <div><label>PIC</label><input id="pic" placeholder="Nama PIC" autocomplete="name"></div>
      <div><label>Lokasi / Area</label><select id="lokasi"><option value="">— pilih —</option></select></div>
    </div>
  </div>

  <!-- SCANNER -->
  <div class="card">
    <div id="reader"></div>
    <div class="row" style="margin-top:8px">
      <button id="btnScan" class="b-pri">📷 Mulai Scan</button>
      <button id="btnFoto" class="b-sec">🖼️ Foto Barcode</button>
    </div>
    <input id="file" type="file" accept="image/*" capture="environment" class="hide">
    <label>atau ketik / scanner bluetooth</label>
    <div class="row">
      <input id="manual" placeholder="Kode barcode lalu Enter" autocapitalize="characters" style="flex:3">
      <button id="btnCari" class="b-sec" style="flex:1">Cari</button>
    </div>
    <div class="chk"><input type="checkbox" id="mode1"><span>Mode cepat: Qty otomatis <b>1</b> & langsung simpan tiap scan</span></div>
    <p class="hint" id="camHint"></p>
    <div id="readerFile" class="hide"></div>
  </div>

  <!-- HASIL SCAN -->
  <div class="card hide" id="result">
    <span class="kode" id="rKode"></span><span class="badge" id="rSat"></span>
    <div class="nama" id="rNama"></div>
    <div id="rAlert"></div>
    <div id="rManualBox" class="hide">
      <label>Nama Item (manual, item belum ada di master)</label>
      <input id="namaManual" placeholder="Tulis nama barang">
    </div>
    <label>Qty <span id="rSat2"></span></label>
    <input id="qty" inputmode="decimal" placeholder="0" autocomplete="off">
    <label>Catatan (opsional)</label>
    <input id="catatan" placeholder="mis. rusak, kemasan terbuka">
    <div class="row" style="margin-top:12px">
      <button id="btnBatal" class="b-sec">Batal</button>
      <button id="btnSimpan" class="b-pri" style="flex:2">💾 Simpan</button>
    </div>
  </div>

  <!-- RIWAYAT -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Scan saya hari ini</b><span class="stat" id="cnt">0 data</span>
    </div>
    <div class="list" id="list"><p class="hint">Belum ada data.</p></div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const S = { items: {}, cur: null, scanner: null, scanning: false, busy: false, lastCode: '', lastTime: 0 };
const store = {
  get: k => { try { return localStorage.getItem('stob_' + k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem('stob_' + k, v); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = k => String(k || '').trim().toUpperCase();
/* ===== KONFIGURASI VERSI GITHUB =====
 * Isi 2 nilai ini bila file ini di-host di GitHub Pages (supaya kamera bisa dibuka).
 * Nilainya ada di Spreadsheet: menu STO Barcode > Info link HP (GitHub).
 * Bila dibuka dari link Apps Script (/exec), biarkan kosong.
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzCuOh0oIGFaIsyJQ-tvARYe360TFd_CgPOB6iOoopM3pxRQ8vi9yJ1AbnHbQ4MOxuOeA/exec';
const API_KEY = 'c6cbd0f1b77144cc';

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const API_NAME = { getInit: 'init', lookupItem: 'lookup', checkScanned: 'check', saveScan: 'save', getRecent: 'recent', deleteScan: 'del' };
function run(fn, ...a) {
  if (IN_GAS) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e))[fn](...a));
  return apiCall(fn, a);
}
async function apiCall(fn, a) {
  const url = API_URL || store.get('api_url'), key = API_KEY || store.get('api_key');
  if (!url) throw new Error('API_URL belum diisi di file scan.html');
  const body = { api: API_NAME[fn], key: key };
  if (fn === 'lookupItem' || fn === 'checkScanned') body.kode = a[0];
  if (fn === 'saveScan') body.data = a[0];
  if (fn === 'getRecent') body.pic = a[0];
  if (fn === 'deleteScan') { body.rid = a[0]; body.pic = a[1]; }
  let r;
  try {
    // text/plain supaya tidak ada preflight CORS; Apps Script mengembalikan JSON
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('Tidak bisa menghubungi server (cek internet / akses deployment = Siapa saja)'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Jawaban server tidak valid. Pastikan deployment akses = Siapa saja & API_URL berakhiran /exec'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
// Alternatif tanpa edit file: buka scan.html?api=URL_EXEC&key=API_KEY sekali, nilainya tersimpan di HP
(function () {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('api')) { store.set('api_url', q.get('api')); store.set('api_key', q.get('key') || ''); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms || 2200);
}
function beep(ok) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = ok ? 1500 : 300; o.connect(g); g.connect(ctx.destination);
    g.gain.value = .15; o.start(); o.stop(ctx.currentTime + (ok ? .12 : .35));
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 80 : [100, 60, 100]); } catch (e) {}
}

/* ---------- INIT ---------- */
run('getInit').then(d => {
  $('tgl').textContent = 'Tanggal STO: ' + d.today;
  $('ver').textContent = 'v' + d.version;
  d.items.forEach(x => S.items[norm(x[0])] = x);
  const sel = $('lokasi');
  d.lokasi.forEach(l => { const o = document.createElement('option'); o.value = o.textContent = l; sel.appendChild(o); });
  $('pic').value = store.get('pic');
  if (store.get('lokasi')) sel.value = store.get('lokasi');
  $('mode1').checked = store.get('mode1') === '1';
  $('camHint').textContent = d.items.length + ' item master termuat.';
  loadRecent();
}).catch(e => toast('Gagal memuat: ' + e.message, 6000));

$('pic').addEventListener('change', () => { store.set('pic', $('pic').value.trim()); loadRecent(); });
$('lokasi').addEventListener('change', () => store.set('lokasi', $('lokasi').value));
$('mode1').addEventListener('change', () => store.set('mode1', $('mode1').checked ? '1' : '0'));

function needSetup() {
  if (!$('pic').value.trim()) { toast('Isi nama PIC dulu'); $('pic').focus(); return true; }
  if (!$('lokasi').value) { toast('Pilih Lokasi dulu'); $('lokasi').focus(); return true; }
  return false;
}

/* ---------- SCANNER KAMERA ---------- */
const FORMATS = [
  Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.QR_CODE
];
const scanCfg = { formatsToSupport: FORMATS, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };

async function startScan() {
  if (needSetup()) return;
  if (!S.scanner) S.scanner = new Html5Qrcode('reader', scanCfg);
  try {
    await S.scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * .85), height: Math.floor(Math.min(h, w) * .5) }), aspectRatio: 1.333 },
      onDecoded, () => {});
    S.scanning = true; $('btnScan').textContent = '⏹ Stop Scan'; $('camHint').textContent = 'Arahkan kamera ke barcode.';
  } catch (e) {
    S.scanning = false;
    const blocked = /NotAllowed|Permission/i.test(String(e && (e.name || e.message) || e));
    $('camHint').innerHTML = '<span style="color:#b42318">Kamera langsung tidak bisa dibuka (' + esc(e.message || e) + ').</span><br>' +
      (blocked && IN_GAS
        ? 'Halaman Google Apps Script memblokir kamera. Pakai <b>versi GitHub</b> (lihat README), atau sementara pakai tombol <b>Foto Barcode</b>.'
        : blocked
          ? 'Izinkan kamera: ketuk ikon 🔒 / ⓘ di sebelah alamat web → Izin → Kamera → Izinkan, lalu muat ulang.'
          : 'Pakai tombol <b>Foto Barcode</b> atau ketik kode.');
  }
}
async function stopScan() {
  if (S.scanner && S.scanning) { try { await S.scanner.stop(); } catch (e) {} }
  S.scanning = false; $('btnScan').textContent = '📷 Mulai Scan';
}
function pauseScan() { if (S.scanner && S.scanning) { try { S.scanner.pause(true); } catch (e) {} } }
function resumeScan() { if (S.scanner && S.scanning) { try { S.scanner.resume(); } catch (e) {} } }

$('btnScan').onclick = () => S.scanning ? stopScan() : startScan();

function onDecoded(text) {
  const now = Date.now();
  if (S.busy || (text === S.lastCode && now - S.lastTime < 2500)) return;   // cegah dobel baca
  S.lastCode = text; S.lastTime = now;
  handleCode(text);
}

/* ---------- FOTO BARCODE (cadangan bila kamera live diblokir) ---------- */
$('btnFoto').onclick = () => { if (!needSetup()) $('file').click(); };
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  toast('Membaca barcode…');
  try {
    const r = new Html5Qrcode('readerFile', scanCfg);
    const text = await r.scanFile(f, false);
    try { r.clear(); } catch (x) {}
    handleCode(text);
  } catch (err) { beep(false); toast('Barcode tidak terbaca. Foto lebih dekat & terang, atau ketik kode.', 4000); }
};

/* ---------- INPUT MANUAL / SCANNER BLUETOOTH ---------- */
$('manual').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btnCari').click(); } });
$('btnCari').onclick = () => {
  const v = $('manual').value.trim(); if (!v) return;
  if (needSetup()) return;
  $('manual').value = ''; handleCode(v);
};

/* ---------- PROSES KODE ---------- */
async function handleCode(raw) {
  const kode = String(raw).trim();
  if (!kode) return;
  pauseScan();
  let it = S.items[norm(kode)];
  if (!it) {  // mungkin item baru ditambahkan setelah aplikasi dibuka
    try { it = await run('lookupItem', kode); if (it) S.items[norm(it[0])] = it; } catch (e) {}
  }
  beep(!!it);

  if ($('mode1').checked && it) {   // mode cepat
    S.cur = { kode: it[0], item: it };
    return save('1', '');
  }
  showResult(kode, it);
}

function showResult(kode, it) {
  S.cur = { kode: it ? it[0] : kode, item: it };
  $('rKode').textContent = S.cur.kode;
  $('rNama').textContent = it ? it[1] : 'ITEM TIDAK TERDAFTAR';
  $('rNama').style.color = it ? '' : '#b42318';
  $('rSat').textContent = it && it[2] ? it[2] : '';
  $('rSat').classList.toggle('hide', !(it && it[2]));
  $('rSat2').textContent = it && it[2] ? '(' + it[2] + ')' : '';
  $('rManualBox').classList.toggle('hide', !!it);
  $('rAlert').innerHTML = it ? '' : '<div class="alert a-err">Kode ini belum ada di Master_Item. Cek label, atau simpan dengan nama manual (status: TIDAK TERDAFTAR).</div>';
  $('qty').value = ''; $('catatan').value = ''; $('namaManual').value = '';
  $('result').classList.remove('hide');
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => $('qty').focus(), 250);

  // peringatan bila sudah pernah discan hari ini
  run('checkScanned', S.cur.kode).then(list => {
    if (!list.length || !S.cur || S.cur.kode !== (it ? it[0] : kode)) return;
    const tot = list.reduce((a, b) => a + (Number(b.qty) || 0), 0);
    $('rAlert').innerHTML += '<div class="alert a-warn">⚠️ Sudah discan ' + list.length + 'x hari ini (total ' + tot + '):<br>' +
      list.slice(-4).map(x => esc(x.time + ' · ' + x.lokasi + ' · ' + x.pic + ' · ' + x.qty)).join('<br>') +
      '<br>Simpan lagi hanya jika ini barang/tumpukan yang berbeda.</div>';
  }).catch(() => {});
}

function hideResult() { $('result').classList.add('hide'); S.cur = null; resumeScan(); }
$('btnBatal').onclick = hideResult;
$('qty').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btnSimpan').click(); } });
$('catatan').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btnSimpan').click(); } });
$('btnSimpan').onclick = () => {
  const q = $('qty').value.trim();
  if (!/^\d[\d.,]*$/.test(q)) { toast('Isi Qty dengan angka'); $('qty').focus(); return; }
  if (!S.cur.item && !$('namaManual').value.trim()) { toast('Isi nama item manual'); $('namaManual').focus(); return; }
  save(q, $('catatan').value.trim());
};

async function save(qty, note) {
  if (S.busy || !S.cur) return;
  S.busy = true; $('btnSimpan').disabled = true; $('btnSimpan').textContent = 'Menyimpan…';
  try {
    const r = await run('saveScan', {
      pic: $('pic').value.trim(), lokasi: $('lokasi').value, kode: S.cur.kode,
      qty: qty, catatan: note, namaManual: $('namaManual').value.trim()
    });
    toast('✅ Tersimpan: ' + (r.nama || S.cur.kode) + ' = ' + qty + (r.satuan ? ' ' + r.satuan : ''));
    hideResult();
    loadRecent();
  } catch (e) {
    beep(false); toast('Gagal simpan: ' + e.message, 5000);
    if ($('mode1').checked) resumeScan();
  } finally {
    S.busy = false; $('btnSimpan').disabled = false; $('btnSimpan').textContent = '💾 Simpan';
  }
}

/* ---------- RIWAYAT ---------- */
function loadRecent() {
  const pic = $('pic').value.trim();
  if (!pic) return;
  run('getRecent', pic).then(d => {
    $('cnt').textContent = d.count + ' data';
    $('list').innerHTML = d.rows.length ? d.rows.map(r =>
      '<div class="it"><div><b>' + esc(r.nama || '(tanpa nama)') + '</b>' +
      (r.status !== 'OK' ? ' <span class="badge" style="background:#fde8e6;color:#b42318">' + esc(r.status) + '</span>' : '') +
      '<br><span class="stat">' + esc(r.time + ' · ' + r.kode + ' · ' + r.lokasi) + (r.note ? ' · ' + esc(r.note) : '') + '</span></div>' +
      '<div style="text-align:right"><span class="q">' + esc(r.qty) + ' ' + esc(r.satuan) + '</span><br>' +
      '<button class="x" data-rid="' + esc(r.rid) + '">Hapus</button></div></div>').join('')
      : '<p class="hint">Belum ada data.</p>';
  }).catch(() => {});
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-rid]'); if (!b) return;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Yakin hapus?'; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'Hapus'; }, 3000); return; }
  b.disabled = true;
  run('deleteScan', b.dataset.rid, $('pic').value.trim())
    .then(() => { toast('Data dihapus'); loadRecent(); })
    .catch(err => { toast('Gagal hapus: ' + err.message, 4000); b.disabled = false; });
});
</script>
</body>
</html>
